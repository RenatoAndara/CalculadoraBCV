<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Badge Banner -->
  <g filter="url(#shadow)">
    <!-- Central Card -->
    <rect x="76" y="96" width="360" height="320" rx="36" fill="#1e293b" stroke="#334155" stroke-width="3" />
    
    <!-- Header band -->
    <path d="M 76 132 C 76 112 92 96 112 96 L 400 96 C 420 96 436 112 436 132 L 436 160 L 76 160 Z" fill="url(#accentGrad)" />
    
    <!-- Title text -->
    <text x="256" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">BCV TASAS</text>

    <!-- Currency Symbols -->
    <!-- USD -->
    <circle cx="160" cy="245" r="46" fill="#0f172a" stroke="#10b981" stroke-width="3" />
    <text x="160" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#10b981" text-anchor="middle">$</text>

    <!-- EUR -->
    <circle cx="352" cy="245" r="46" fill="#0f172a" stroke="#06b6d4" stroke-width="3" />
    <text x="352" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#06b6d4" text-anchor="middle">€</text>

    <!-- Exchange Arrow -->
    <path d="M 230 245 L 282 245 M 270 233 L 282 245 L 270 257" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 282 235 L 230 235 M 242 223 L 230 235 L 242 247" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

    <!-- Bolivares (Bs.) Bottom Badge -->
    <rect x="136" y="325" width="240" height="60" rx="18" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" />
    <text x="256" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="2">Bs. DIGITAL</text>
  </g>
</svg>