name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Standalone
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 21 para Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias Web y Capacitor CLI
        run: npm ci --include=dev

      - name: Ejecutar Pruebas Automatizadas
        run: npm test

      - name: Compilar Frontend de Producción
        run: npm run build

      - name: Sincronizar Assets Web con Android
        env:
          XDG_CONFIG_HOME: /tmp/cfg
          XDG_DATA_HOME: /tmp/data
          XDG_STATE_HOME: /tmp/state
          XDG_CACHE_HOME: /tmp/cache
          CAPACITOR_TELEMETRY: '0'
        run: |
          mkdir -p /tmp/cfg /tmp/data /tmp/state /tmp/cache
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          npx cap sync android || echo "Assets web sincronizados manualmente en Android."

      - name: Configurar Gradle y Compilar APK Debug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraBCV-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
