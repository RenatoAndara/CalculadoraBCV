name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Standalone
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias Web
        run: npm ci

      - name: Ejecutar Pruebas Automatizadas
        run: npm test

      - name: Compilar Frontend de Producción
        run: npm run build

      - name: Sincronizar con Capacitor Android
        run: |
          mkdir -p ~/.config/capacitor
          npx cap sync android

      - name: Configurar Java 17 para Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle y Compilar APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraBCV-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
