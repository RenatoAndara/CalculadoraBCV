name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Standalone
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 21 para Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias Web y Capacitor CLI
        run: npm ci --include=dev

      - name: Ejecutar Pruebas Automatizadas
        run: npm test

      - name: Generar Iconos Nativos de Android y Web
        run: |
          if [ -f scripts/generate_icons.py ]; then
            pip install Pillow
            python3 scripts/generate_icons.py
          else
            echo "Generador de iconos no presente, omitiendo paso."
          fi

      - name: Compilar Frontend de Producción
        run: npm run build

      - name: Sincronizar Assets Web con Android
        env:
          XDG_CONFIG_HOME: /tmp/cfg
          XDG_DATA_HOME: /tmp/data
          XDG_STATE_HOME: /tmp/state
          XDG_CACHE_HOME: /tmp/cache
          CAPACITOR_TELEMETRY: '0'
        run: |
          mkdir -p /tmp/cfg /tmp/data /tmp/state /tmp/cache
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          npx cap sync android || echo "Assets web sincronizados manualmente en Android."

      # Firma permanente: la llave viene de los Secretos del repositorio (nunca del código).
      # Si faltan los secretos, compila una versión debug como antes (no actualizable encima).
      - name: Restaurar Llave de Firma
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
        run: |
          if [ -n "$FIRMA_BASE64" ]; then
            echo "$FIRMA_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "FIRMA_ARCHIVO=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
            echo "Llave de firma restaurada."
          else
            echo "::warning::Faltan los secretos FIRMA_BASE64/FIRMA_CLAVE/FIRMA_ALIAS. Se compilará un APK debug que NO se puede instalar encima de la versión anterior."
          fi

      - name: Compilar APK
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
        run: |
          export VERSION_CODE="${{ github.run_number }}"
          export VERSION_NAME="$(node -p "require('./package.json').version")"
          echo "Versión ${VERSION_NAME} (código ${VERSION_CODE})"
          cd android
          chmod +x ./gradlew
          mkdir -p ../salida
          if [ -n "$FIRMA_ARCHIVO" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../salida/CalculadoraBCV-v${VERSION_NAME}.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../salida/CalculadoraBCV-v${VERSION_NAME}-debug.apk"
          fi

      - name: Verificar Firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs salida/*.apk

      - name: Borrar Llave Temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/firma.jks"

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraBCV-Android-APK
          path: salida/*.apk
          retention-days: 30
